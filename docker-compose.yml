services:
  frontend:
    container_name: "react-frontend"
    build:
      context: ./frontend
    ports:
      - "80:5173"

  backend:
    environment:
      API_ID: ${API_ID}
      API_HASH: ${API_HASH}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
    container_name: "fastapi-backend"
    build:
      context: ./backend
    ports:
      - "8000:8000"
  signal-api:
    container_name: "signal-api"
    user: "1000:1000" # change to UID:GID you preferre
    image: bbernhard/signal-cli-rest-api:rootless-latest
    environment:
      - MODE=normal
    build:
      context: ./signal-api
    ports:
      - "8080:8080"
    volumes:
      - "./signal-api/signal-cli-config:/home/.local/share/signal-cli" 
    tmpfs:
      - /run:exec,size=64m,uid=1000,gid=1000,mode=0755